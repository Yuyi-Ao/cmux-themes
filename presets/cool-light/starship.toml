"$schema" = 'https://starship.rs/config-schema.json'

# Three restrained Powerline segments: directory, Git, language versions.
# No Apple decoration. Existing module behavior and full directory path retained.
format = """
[░▒▓](#bac9d3)\
$directory\
[](fg:#bac9d3 bg:#cbd5dd)\
$git_branch\
$git_status\
[](fg:#cbd5dd bg:#d9dfe4)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[ ](fg:#d9dfe4)\
\n$character"""

[directory]
style = "fg:#263943 bg:#bac9d3"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"

[git_branch]
symbol = ""
style = "fg:#365264 bg:#cbd5dd"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:#365264 bg:#cbd5dd"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "fg:#5a4d68 bg:#d9dfe4"
format = "[ $symbol ($version) ]($style)"

[bun]
symbol = ""
style = "fg:#5a4d68 bg:#d9dfe4"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "fg:#5a4d68 bg:#d9dfe4"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "fg:#5a4d68 bg:#d9dfe4"
format = "[ $symbol ($version) ]($style)"

[php]
symbol = ""
style = "fg:#5a4d68 bg:#d9dfe4"
format = "[ $symbol ($version) ]($style)"

[time]
disabled = true

[character]
success_symbol = "[❯](fg:#38647a)"
error_symbol = "[❯](fg:#a44343)"

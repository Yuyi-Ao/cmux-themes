# Original author: minimalmattt
# Source: https://github.com/starship/starship/discussions/1107#discussioncomment-14447911
# Adaptations: see ../CREDITS.md
"format" = "[╭](bold overlay1)🛸 $directory$git_branch$git_status$kubernetes $time \n$character"
"palette" = "gruvbox"
["palettes"]
["palettes"."gruvbox"]
"color_fg0" = "#ebdbb2"
"color_bg0" = "#3C4841"
"color_bg1" = "#3c3836"
"color_bg3" = "#665c54"
"color_blue" = "#458588"
"color_aqua" = "#689d6a"
"color_green" = "#98971a"
"color_orange" = "#d65d0e"
"color_red" = "#cc241d"
"color_yellow" = "#d79921"
["character"]
"format" = "[╰─$symbol](fg:overlay1) "
"success_symbol" = "[](fg:bold text)"
"error_symbol" = "[](fg:bold red)"
["directory"]
"format" = "$path"
"truncation_length" = 3
"truncation_symbol" = "…/"
["directory"."substitutions"]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
["git_branch"]
"style" = "fg:color_yellow"
"disabled" = false
"symbol" = ""
"format" = "( | [$symbol]($style) $branch)"
["git_status"]
"disabled" = false
"style" = "fg:color_orange"
"format" = "( [$all_status]($style))"
["kubernetes"]
"disabled" = true
"style" = "fg:color_yellow"
"format" = "( | [$context]($style)( in [$namespace]($style)))"
["time"]
"disabled" = false
"time_format" = "%R"
"format" = "| $time"
["username"]
"disabled" = true
["hostname"]
"disabled" = true
["localip"]
"disabled" = true
["aws"]
"disabled" = true
["gcloud"]
"disabled" = true
["azure"]
"disabled" = true
["docker_context"]
"disabled" = true
["env_var"]
"disabled" = true
["sudo"]
"disabled" = true

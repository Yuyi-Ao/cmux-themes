# Original author: muuvmuuv
# Source: https://github.com/starship/starship/discussions/1107#discussioncomment-7310986
# Adaptations: see ../CREDITS.md
"format" = "$directory$git_branch$git_commit$git_state$git_metrics$git_status$package$nodejs$vlang$swift$zig$php$python$deno$rust$bun$golang$env_var$cmd_duration$time$jobs$line_break"
"add_newline" = false
["character"]
"success_symbol" = "[;](bold green)"
"error_symbol" = "[;](bold red)"
"vimcmd_symbol" = "[#](bold red)"
["time"]
"disabled" = false
"time_format" = "%X"
"format" = "at [$time]($style)"
"style" = "bold 243"
["directory"]
"truncate_to_repo" = false
"truncation_length" = 17
"truncation_symbol" = "../"
"read_only" = " "
["directory"."substitutions"]
"~/Developer/M8FINDER" = "/M8"
["python"]
"python_binary" = "python3"
"format" = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
"symbol" = "󰌠 "
["swift"]
"symbol" = " "
["package"]
"symbol" = "󰏗 "
"display_private" = true
["git_branch"]
"symbol" = " "
["git_commit"]
"tag_symbol" = " "
["git_status"]
"conflicted" = ""
"deleted" = "${count}"
"staged" = "[++\\($count\\)](green)"
"ahead" = "${count}"
"diverged" = "󰕚${ahead_count}${behind_count}"
"behind" = "${count}"
["golang"]
"symbol" = " "
["php"]
"symbol" = " "
["rust"]
"symbol" = " "
["sudo"]
"style" = "bold red"
"symbol" = "! "
"disabled" = true
["username"]
"disabled" = true
["hostname"]
"disabled" = true
["localip"]
"disabled" = true
["aws"]
"disabled" = true
["gcloud"]
"disabled" = true
["azure"]
"disabled" = true
["kubernetes"]
"disabled" = true
["docker_context"]
"disabled" = true
["env_var"]
"disabled" = true

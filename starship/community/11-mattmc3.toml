# Original author: mattmc3
# Source: https://github.com/starship/starship/discussions/1107#discussioncomment-4783851
# Adaptations: see ../CREDITS.md
"add_newline" = false
"format" = "$python$directory$character"
"right_format" = "$status$all"
["character"]
"success_symbol" = "[❯](red)[❯](yellow)[❯](green)"
"error_symbol" = "[❯](red)[❯](yellow)[❯](green)"
"vicmd_symbol" = "[❮](green)[❮](yellow)[❮](red)"
["git_branch"]
"format" = "[$branch]($style) "
"style" = "bold green"
["python"]
"format" = "\\($virtualenv\\) "
["git_status"]
"format" = "$all_status$ahead_behind "
"ahead" = "[⬆](bold purple) "
"behind" = "[⬇](bold purple) "
"staged" = "[✚](green) "
"deleted" = "[✖](red) "
"renamed" = "[➜](purple) "
"stashed" = "[✭](cyan) "
"untracked" = "[◼](white) "
"modified" = "[✱](blue) "
"conflicted" = "[═](yellow) "
"diverged" = "⇕ "
"up_to_date" = ""
["directory"]
"style" = "blue"
"truncation_length" = 1
"truncation_symbol" = ""
"fish_style_pwd_dir_length" = 1
["cmd_duration"]
"format" = "[$duration]($style) "
["line_break"]
"disabled" = true
["status"]
"disabled" = false
"symbol" = "✘ "
["username"]
"disabled" = true
["hostname"]
"disabled" = true
["localip"]
"disabled" = true
["aws"]
"disabled" = true
["gcloud"]
"disabled" = true
["azure"]
"disabled" = true
["kubernetes"]
"disabled" = true
["docker_context"]
"disabled" = true
["env_var"]
"disabled" = true
["sudo"]
"disabled" = true

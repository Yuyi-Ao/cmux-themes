"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$php\
\n$character"""

[directory]
style = "fg:#b3bfad"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"


[git_branch]
symbol = ""
style = "fg:#9ab395"
format = '[[ $symbol $branch ](fg:#9ab395)]($style)'

[git_status]
style = "fg:#9ab395"
format = '[[($all_status$ahead_behind )](fg:#9ab395)]($style)'

[nodejs]
symbol = ""
style = "fg:#b3a384"
format = '[[ $symbol ($version) ](fg:#b3a384)]($style)'

[bun]
symbol = ""
style = "fg:#b3a384"
format = '[[ $symbol ($version) ](fg:#b3a384)]($style)'

[rust]
symbol = ""
style = "fg:#b3a384"
format = '[[ $symbol ($version) ](fg:#b3a384)]($style)'

[golang]
symbol = ""
style = "fg:#b3a384"
format = '[[ $symbol ($version) ](fg:#b3a384)]($style)'

[php]
symbol = ""
style = "fg:#b3a384"
format = '[[ $symbol ($version) ](fg:#b3a384)]($style)'

[time]
disabled = true

[character]
success_symbol = "[❯](fg:#9ab395)"
error_symbol = "[❯](fg:#c78278)"

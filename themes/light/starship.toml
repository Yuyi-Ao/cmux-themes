"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$php\
\n$character"""

[directory]
style = "fg:#45443f"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"


[git_branch]
symbol = ""
style = "fg:#42685b"
format = '[[ $symbol $branch ](fg:#42685b)]($style)'

[git_status]
style = "fg:#42685b"
format = '[[($all_status$ahead_behind )](fg:#42685b)]($style)'

[nodejs]
symbol = ""
style = "fg:#716149"
format = '[[ $symbol ($version) ](fg:#716149)]($style)'

[bun]
symbol = ""
style = "fg:#716149"
format = '[[ $symbol ($version) ](fg:#716149)]($style)'

[rust]
symbol = ""
style = "fg:#716149"
format = '[[ $symbol ($version) ](fg:#716149)]($style)'

[golang]
symbol = ""
style = "fg:#716149"
format = '[[ $symbol ($version) ](fg:#716149)]($style)'

[php]
symbol = ""
style = "fg:#716149"
format = '[[ $symbol ($version) ](fg:#716149)]($style)'

[time]
disabled = true

[character]
success_symbol = "[❯](fg:#42685b)"
error_symbol = "[❯](fg:#a44343)"
